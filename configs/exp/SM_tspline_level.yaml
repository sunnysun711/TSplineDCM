# Run: python run.py configs/exp/SM_tspline_level_tuned.yaml
dataset: SM
model: tspline
model_name: tspline_level
splits: 0-99
init_seeds: [42]
overrides:
  dcm_config:
    learn_asc: true
    alt_xs_knots:
      TRAIN: [40, 40, 5]
      SM: [40, 40, 5]
      CAR: [40, 40]
  model_config:
    MC_k: 3
    MC_delta_floor: 0.0
    SP_heter_target: level
  train_config:
    epochs: 100
    early_stopping_patience: 30
    eval_mode: mc
