# Run: python run.py configs/exp/LPMC_tspline_homo_tuned.yaml
dataset: LPMC
splits_name: LPMC_officialtest
model: tspline
model_name: tspline_homo
splits: 0-99
init_seeds: [42]
overrides:
  dcm_config:
    learn_asc: true
    alt_xs_knots:
      WALK: [60]
      CYCLE: [60]
      PT: [60, 20, 60, 40, 20, 4, 20]
      CAR: [60, 40, 3, 60]
    k_gpi_cap: 0.0
  model_config:
    MC_k: 3
    MC_delta_floor: 0.0
    SP_heter_target: increment
  train_config:
    epochs: 100
    early_stopping_patience: 20
    eval_mode: mc
search_space:
  dcm_config.k_gpi_cap: null
  model_config.SP_k_gpi_start: null
  model_config.T_beta: null
  model_config.T_vae_layers: null
