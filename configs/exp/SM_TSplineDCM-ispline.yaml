# Swissmetro TSplineDCM, increment-scaling heterogeneity variant (model_name: TSplineDCM-ispline).
# Frozen configuration used by tests/test_golden_tspline.py (fixed forward pass on a stored batch).
# HPO: random search, 30 trials, split 0 val NLL, seed 42; winner val_nll=0.7212 (trial 9).
# Run: python run.py configs/exp/SM_TSplineDCM-ispline.yaml
dataset: SM
model: tspline
model_name: TSplineDCM-ispline
splits: 0-99
init_seeds:
- 42
overrides:
  dcm_config:
    learn_asc: true
    alt_xs_knots:
      TRAIN:
      - 12
      - 7
      - 5
      SM:
      - 12
      - 7
      - 5
      CAR:
      - 12
      - 7
    k_gpi_cap:
      TRAIN:
      - 0.08
      - 0.0
      - 0.05
      SM:
      - 0.08
      - 0.0
      - 0.05
      CAR:
      - 0.08
      - 0.0
  model_config:
    T_vae_layers:
    - 128
    T_beta: 3.003
    SP_k_gpi_start: 0.1552
    SP_heter_target: increment
  train_config:
    epochs: 100
    early_stopping_patience: 30
    eval_mode: mc
    lr: 0.02565
