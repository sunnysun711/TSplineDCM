# Run: python run.py configs/exp/LPMCsub_tspline_tuned.yaml
dataset: LPMC_sub
splits_name: LPMC_sub_officialtest
model: tspline
model_name: tspline
splits: 0-99
init_seeds: [42]
overrides:
  dcm_config:
    learn_asc: true
    alt_xs_knots:
      WALK: [60]
      CYCLE: [60]
      PT: [60, 20, 60, 40, 20, 4, 20]
      CAR: [60, 40, 3, 60]
  model_config:
    MC_k: 3
    MC_delta_floor: 0.0
    SP_heter_target: increment
  train_config:
    epochs: 100
    early_stopping_patience: 20
    eval_mode: mc
