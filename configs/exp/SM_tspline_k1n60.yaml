dataset: SM
model: tspline
model_name: tspline_k1n60
splits: 0-99
init_seeds: [42]
overrides:
  dcm_config:
    learn_asc: true
    alt_xs_knots:
      TRAIN: [60, 60, 5]
      SM: [60, 60, 5]
      CAR: [60, 60]
  model_config:
    MC_k: 1
    MC_delta_floor: 0.0
    SP_heter_target: increment
  train_config:
    epochs: 100
    early_stopping_patience: 30
    eval_mode: mc
