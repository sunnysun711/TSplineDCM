dataset: SM
model: tspline
model_name: tspline_k1n100p
splits: 0-99
init_seeds: [42]
overrides:
  dcm_config:
    learn_asc: true
    alt_xs_knots:
      TRAIN: [100, 100, 5]
      SM: [100, 100, 5]
      CAR: [100, 100]
  model_config:
    MC_k: 1
    MC_delta_floor: 0.0
    SP_heter_target: increment
  train_config:
    epochs: 100
    early_stopping_patience: 30
    eval_mode: mc
search_space:                      # added to configs/models/tspline.yaml's space (tune.py merges)
  model_config.SP_l2_incr: {type: loguniform, lo: 1.0e-6, hi: 1.0e-1}
  model_config.SP_tv_slope: {type: loguniform, lo: 1.0e-6, hi: 1.0e-1}
