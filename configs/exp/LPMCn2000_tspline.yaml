# Learning curve: LPMC train+val pool shrunk to ~2,000 rows of whole households, official
# test unchanged, splits 0-19. Hyperparameters = LPMCsub_tspline_tuned.yaml (tuned at 7,677 rows), not retuned.
# Knots: the dataset defaults (LPMC_sub.yaml), not the tuned 60-knot grids, which do not initialise on this few rows.
# Run: python paper.py configs/paper/LPMC_n2000.yaml --stage run analyze
dataset: LPMC_sub
model: tspline
splits_name: LPMC_n2000_officialtest
model_name: tspline
splits: 0-19
init_seeds:
- 42
overrides:
  dcm_config:
    learn_asc: true
    k_gpi_cap: 0.9704
  model_config:
    MC_k: 3
    MC_delta_floor: 0.0
    SP_heter_target: increment
    T_beta: 3.758
    SP_k_gpi_start: 0.7138
    T_vae_layers:
    - 64
    SP_l2_incr: 0.008021
    MC_reverse_eps: 0.0001
  train_config:
    epochs: 100
    early_stopping_patience: 20
    eval_mode: mc
    lr: 0.03353
